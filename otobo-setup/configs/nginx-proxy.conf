# ============================================================
# Résolve360 — reclam.digitalfactory.sn
# URLs : /customer.pl | /akcil | /akcil2
# Toute erreur 404 → redirection vers /customer.pl
# ============================================================

server {
  listen 80;
  listen [::]:80;
  server_name reclam.digitalfactory.sn;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name reclam.digitalfactory.sn;

  ssl_certificate     /etc/letsencrypt/live/reclam.digitalfactory.sn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/reclam.digitalfactory.sn/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  access_log /data/logs/proxy-host-48_access.log proxy;
  error_log  /data/logs/proxy-host-48_error.log warn;

  # ── TOUTE ERREUR 404 → Portail client ─────────────────────
  error_page 404 = @redirect_login;
  location @redirect_login {
    return 302 /customer.pl;
  }

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $host;
  proxy_read_timeout 300s;
  proxy_connect_timeout 75s;

  # ── ROOT → /customer.pl ───────────────────────────────────
  location = / {
    return 301 /customer.pl;
  }

  # ── PORTAIL CLIENT → /customer.pl ─────────────────────────
  location ~ ^/customer\.pl {
    proxy_pass http://172.17.0.1:8420/otobo/customer.pl$is_args$args;
    proxy_redirect http://172.17.0.1:8420/otobo/customer.pl /customer.pl;
    proxy_redirect /otobo/customer.pl /customer.pl;
    proxy_redirect /otobo/index.pl /akcil;
    proxy_cookie_path /otobo/ /;
    sub_filter '/otobo/customer.pl' '/customer.pl';
    sub_filter '/otobo/index.pl' '/akcil';
    sub_filter '/otobo-web/' '/res/';
    sub_filter 'Request Account' 'Créer un compte';
    sub_filter 'Forgot password?' 'Mot de passe oublié ?';
    sub_filter 'Your Tickets. Your OTOBO.' 'Votre satisfaction, notre engagement.';
    sub_filter 'Login - OTOBO 11' 'Connexion — Résolve360';
    sub_filter 'OTOBO 11' 'Résolve360';
    sub_filter 'Login failed! Your user name or password was entered incorrectly.' 'Échec de connexion. Identifiant ou mot de passe incorrect.';
    sub_filter 'User name' 'Identifiant';
    sub_filter_once off;
    sub_filter_types text/html text/javascript application/javascript;
  }

  # ── ESPACE AGENT → /akcil (proxy direct pour conserver POST) ──
  location = /akcil {
    proxy_pass http://172.17.0.1:8420/otobo/index.pl;
    proxy_redirect /otobo/index.pl /akcil;
    proxy_redirect /otobo/customer.pl /customer.pl;
    proxy_cookie_path /otobo/ /;
    sub_filter '/otobo/customer.pl' '/customer.pl';
    sub_filter '/otobo/index.pl' '/akcil';
    sub_filter '/otobo-web/' '/res/';
    sub_filter 'Powered by Rother OSS' 'Powered by Résolve360 — Digital Factory SN';
    sub_filter 'Rother OSS' 'Digital Factory SN';
    sub_filter 'https://otobo.io' 'https://reclam.digitalfactory.sn';
    sub_filter 'Login - OTOBO 11' 'Connexion — Résolve360';
    sub_filter 'OTOBO 11' 'Résolve360';
    sub_filter 'OTOBO Helpdesk' 'Résolve360';
    sub_filter 'OTOBO News' 'Actualités';
    sub_filter 'Welcome to OTOBO' 'Bienvenue sur Résolve360';
    sub_filter 'Don&#39;t use the Superuser account to work with OTOBO 11' 'Note : Évitez d&#39;utiliser le compte Superuser pour des tâches courantes';
    sub_filter_once off;
    sub_filter_types text/html text/javascript application/javascript;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # ── ESPACE AGENT → /index.pl ──────────────────────────────
  location ~ ^/index\.pl {
    proxy_pass http://172.17.0.1:8420/otobo/index.pl$is_args$args;
    proxy_redirect /otobo/index.pl /akcil;
    proxy_redirect /otobo/customer.pl /customer.pl;
    proxy_cookie_path /otobo/ /;
    sub_filter '/otobo/customer.pl' '/customer.pl';
    sub_filter '/otobo/index.pl' '/akcil';
    sub_filter '/otobo-web/' '/res/';
    sub_filter 'Powered by Rother OSS' 'Powered by Résolve360 — Digital Factory SN';
    sub_filter 'Rother OSS' 'Digital Factory SN';
    sub_filter 'https://otobo.io' 'https://reclam.digitalfactory.sn';
    sub_filter 'Login - OTOBO 11' 'Connexion — Résolve360';
    sub_filter 'OTOBO 11' 'Résolve360';
    sub_filter 'OTOBO Helpdesk' 'Résolve360';
    sub_filter 'OTOBO News' 'Actualités';
    sub_filter 'Welcome to OTOBO' 'Bienvenue sur Résolve360';
    sub_filter 'Don&#39;t use the Superuser account to work with OTOBO 11' 'Note : Évitez d&#39;utiliser le compte Superuser pour des tâches courantes';
    sub_filter_once off;
    sub_filter_types text/html text/javascript application/javascript;
  }

  # ── ESPACE ADMIN → /akcil2 (proxy direct pour conserver POST) ──
  location = /akcil2 {
    proxy_pass http://172.17.0.1:8420/otobo/index.pl?Action=Admin;
    proxy_redirect /otobo/index.pl /akcil;
    proxy_redirect /otobo/customer.pl /customer.pl;
    proxy_cookie_path /otobo/ /;
    sub_filter '/otobo/customer.pl' '/customer.pl';
    sub_filter '/otobo/index.pl' '/akcil';
    sub_filter '/otobo-web/' '/res/';
    sub_filter 'Powered by Rother OSS' 'Powered by Résolve360 — Digital Factory SN';
    sub_filter 'Rother OSS' 'Digital Factory SN';
    sub_filter 'https://otobo.io' 'https://reclam.digitalfactory.sn';
    sub_filter 'Login - OTOBO 11' 'Connexion — Résolve360';
    sub_filter 'OTOBO 11' 'Résolve360';
    sub_filter 'OTOBO Helpdesk' 'Résolve360';
    sub_filter 'OTOBO News' 'Actualités';
    sub_filter 'Welcome to OTOBO' 'Bienvenue sur Résolve360';
    sub_filter 'Don&#39;t use the Superuser account to work with OTOBO 11' 'Note : Évitez d&#39;utiliser le compte Superuser pour des tâches courantes';
    sub_filter_once off;
    sub_filter_types text/html text/javascript application/javascript;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # ── ASSETS STATIQUES /res/ → /otobo-web/ ──────────────────
  location /res/ {
    proxy_pass http://172.17.0.1:8420/otobo-web/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  # ── FALLBACK /otobo/customer.pl → /customer.pl ────────────
  location ~ ^/otobo/customer\.pl {
    proxy_pass http://172.17.0.1:8420/otobo/customer.pl$is_args$args;
    proxy_redirect http://172.17.0.1:8420/otobo/customer.pl /customer.pl;
    proxy_redirect /otobo/customer.pl /customer.pl;
    proxy_cookie_path /otobo/ /;
    sub_filter '/otobo/customer.pl' '/customer.pl';
    sub_filter '/otobo/index.pl' '/akcil';
    sub_filter '/otobo-web/' '/res/';
    sub_filter_once off;
    sub_filter_types text/html text/javascript application/javascript;
  }

  # ── BLOQUER /otobo/ direct ────────────────────────────────
  location ~ ^/otobo {
    return 302 /customer.pl;
  }

  # ── CATCH-ALL ─────────────────────────────────────────────
  location / {
    proxy_pass http://172.17.0.1:8420;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_intercept_errors on;
  }
}
